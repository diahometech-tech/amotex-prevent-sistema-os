name: Deploy na VPS

# A cada merge no main: confere o TypeScript aqui no GitHub e, se passar,
# entra na VPS da Amotex e roda ~/amotex-prevent/scripts/deploy-sistema-os.sh
# (backup -> git pull -> rebuild -> health check -> rollback se falhar).
#
# A chave em VPS_SSH_KEY só consegue rodar esse script: ela está presa a ele
# por "command=" no ~/.ssh/authorized_keys do usuário deploy.
# Também dá pra disparar à mão em Actions -> Deploy na VPS -> Run workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Em PR só roda o "verificar" (o check aparece antes do merge).
# Um deploy por vez; o seguinte espera o anterior terminar.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-producao' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Mesmo comando do Dockerfile (o lockfile não está 100% em sincronia
      # com o npm 10, e npm ci recusa).
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit

  deploy:
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy pela VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
              "$VPS_USER@$VPS_HOST"
